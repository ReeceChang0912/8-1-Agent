[project]
name = "family-agent"
version = "0.1.0"
description = "家庭综合智能管家 - 统筹小家庭及双方大家庭事务"
requires-python = ">=3.10"

[tool.uv]
# 设置虚拟环境和缓存目录到 D 盘
cache-dir = ".cache"

[dependency-groups]
dev = []
dependencies = [
    # Web 界面
    "streamlit>=1.30.0",
    "streamlit-chat>=0.1.1",
    
    # AI & LLM Framework
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-chroma>=0.1.0",
    
    # Vector Database
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    
    # Voice Interface
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    
    # Image Processing
    "Pillow>=10.0.0",
    
    # WeChat Integration
    "itchat-uos>=1.5.0.dev0",
    
    # Smart Home
    "requests>=2.31.0",
    
    # Task Scheduling
    "schedule>=1.2.0",
    
    # Data Processing
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    
    # LLM Providers (optional)
    "openai>=1.0.0",
    "dashscope>=1.14.0",
]
