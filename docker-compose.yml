services:
  family-agent:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: family-agent-api
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data
      - ./photos:/app/photos
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
