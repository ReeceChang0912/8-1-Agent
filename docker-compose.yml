services:
  family-agent:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: family-agent-api
    ports:
      - "8000:8000"
    env_file:
      - /www/wwwroot/family-agent/.env
    volumes:
      - /www/wwwroot/family-agent/data:/app/data
      - /www/wwwroot/family-agent/photos:/app/photos
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
