name: Family Agent CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 后端测试
  backend-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install uv
      run: |
        pip install uv
    
    - name: Install dependencies
      run: |
        uv pip install --system -r backend/requirements.txt
        uv pip install --system pytest pytest-asyncio pytest-cov
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=family_agent --cov-report=xml \
          --ignore=tests/test_database.py \
          --ignore=tests/test_env_security.py \
          --ignore=tests/test_invite_manager.py \
          --ignore=tests/test_websocket.py \
          -k "not test_member_management and not test_memory_system"
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  # 前端检查
  frontend-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Type check
      run: |
        cd frontend
        npx tsc --noEmit
    
    - name: Build
      run: |
        cd frontend
        npm run build

  # 部署 (仅main分支)
  deploy:
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Package files
      run: |
        tar czf /tmp/deploy.tar.gz \
          --exclude='node_modules' \
          --exclude='.git' \
          --exclude='.venv' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='.env' \
          --exclude='.claude' \
          --exclude='data/*.json' \
          .
    - name: Upload package to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT || '22' }}
        source: "/tmp/deploy.tar.gz"
        target: "/tmp/"
        strip_components: 0

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT || '22' }}
        script: |
          tar xzf /tmp/deploy.tar.gz -C /www/wwwroot/family-agent
          rm -f /tmp/deploy.tar.gz
          cd /www/wwwroot/family-agent
          docker-compose down
          docker-compose up --build -d
          docker image prune -f
