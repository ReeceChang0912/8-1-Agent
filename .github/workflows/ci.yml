name: Family Agent CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 后端测试
  backend-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install uv
      run: |
        pip install uv
    
    - name: Install dependencies
      run: |
        uv pip install --system -r backend/requirements.txt
        uv pip install --system pytest pytest-asyncio pytest-cov
    
    - name: Run tests
      run: |
        python -m pytest tests/test_auth_merge.py \
                tests/test_data_migration.py \
                tests/test_family_defaults.py \
                tests/test_paths.py \
                tests/test_schedule_recommender.py \
                tests/test_smart_photo.py \
                tests/test_smart_shopping.py \
                tests/test_voice_engine.py \
                tests/test_agent.py \
                -v \
                -k "not test_member_management and not test_memory_system"
    
    - name: Upload coverage
      if: false
      uses: codecov/codecov-action@v3

  # 前端检查
  frontend-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Type check
      run: |
        cd frontend
        npx tsc --noEmit
    
    - name: Build
      run: |
        cd frontend
        npm run build

  # 部署 (仅main分支)
  deploy:
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Package files
      run: |
        pwd && ls -la
        tar czf deploy.tar.gz --exclude='.git' .
        ls -lh deploy.tar.gz
    - name: Upload package to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT || '22' }}
        source: "deploy.tar.gz"
        target: "/www/wwwroot/family-agent"
        strip_components: 0

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT || '22' }}
        script: |
          cd /www/wwwroot/family-agent
          tar xzf deploy.tar.gz
          rm -f deploy.tar.gz
          docker-compose down
          docker-compose up --build -d
          docker image prune -f
